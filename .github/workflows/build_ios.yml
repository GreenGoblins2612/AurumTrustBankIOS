name: Build iOS IPA (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      # Build required native recipes for iOS
      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy numpy matplotlib

      # Copy Python files into clean src_app to avoid 3GB rsync recursion loop
      - name: Prepare Clean App Directory & Create Xcode Project
        run: |
          mkdir -p src_app
          if [ -f "main.py" ]; then
            cp main.py renderer_kivy.py "ATB EXPERIMENTAL.py" Aurum_Trust_Bank src_app/ 2>/dev/null || true
          else
            APP_DIR=$(find . -name "main.py" -not -path "*/.*" -not -path "*src_app*" -exec dirname {} \; | head -n 1)
            cp "$APP_DIR"/* src_app/ 2>/dev/null || true
          fi
          echo "Files in isolated src_app:"
          ls -la src_app
          toolchain create AurumTrustBank src_app

      # Compile Xcode project to an iOS Application Bundle
      - name: Build Xcode Project
        run: |
          PROJ_DIR=$(find . -maxdepth 1 -type d -name "*aurumtrustbank-ios*" -o -name "*AurumTrustBank-ios*" | head -n 1)
          cd "$PROJ_DIR"
          xcodebuild clean build \
            -project aurumtrustbank.xcodeproj \
            -scheme aurumtrustbank \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Package the compiled .app into an installable .ipa
      - name: Package IPA
        run: |
          mkdir -p Payload
          # Search both current workspace and Xcode DerivedData
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate compiled .app bundle"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r AurumTrustBank.ipa Payload

      # Upload the final IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-IPA
          path: AurumTrustBank.ipa
          retention-days: 14

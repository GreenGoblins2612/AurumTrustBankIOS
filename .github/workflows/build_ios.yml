
name: Build iOS Xcode Project (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      # Build required native recipes for iOS
      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy numpy matplotlib

      # Prepare app directory and create Xcode project
      - name: Prepare Clean App Directory & Create Xcode Project
        run: |
          mkdir -p src_app
          if [ -f "main.py" ]; then
            cp main.py renderer_kivy.py "ATB EXPERIMENTAL.py" Aurum_Trust_Bank src_app/ 2>/dev/null || true
          else
            APP_DIR=$(find . -name "main.py" -not -path "*/.*" -not -path "*src_app*" -exec dirname {} \; | head -n 1)
            cp "$APP_DIR"/* src_app/ 2>/dev/null || true
          fi
          echo "Files in isolated src_app:"
          ls -la src_app
          toolchain create AurumTrustBank src_app

      # Compile Xcode project
      - name: Build Xcode Project
        run: |
          PROJ_DIR=$(find . -maxdepth 1 -type d \( -name "*aurumtrustbank-ios*" -o -name "*AurumTrustBank-ios*" \) | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: Could not locate generated Xcode project"
            find . -maxdepth 3 -name "*.xcodeproj" -print
            exit 1
          fi
          cd "$PROJ_DIR"
          xcodebuild clean build \
            -project aurumtrustbank.xcodeproj \
            -scheme aurumtrustbank \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Package the Xcode project instead of an IPA
      - name: Package Xcode Project
        run: |
          PROJ_DIR=$(find . -maxdepth 1 -type d \( -name "*aurumtrustbank-ios*" -o -name "*AurumTrustBank-ios*" \) | head -n 1)

          if [ -z "$PROJ_DIR" ] || [ ! -d "$PROJ_DIR/aurumtrustbank.xcodeproj" ]; then
            echo "Error: Xcode project directory not found"
            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJ_DIR")
          zip -r "$GITHUB_WORKSPACE/AurumTrustBank-Xcode-Project.zip" "$PROJ_DIR" \
            -x "$PROJ_DIR/build/*" \
            -x "*/.git/*"

      # Upload the Xcode project
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-Xcode-Project
          path: AurumTrustBank-Xcode-Project.zip
          retention-days: 14

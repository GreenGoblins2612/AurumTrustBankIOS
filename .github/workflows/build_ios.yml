name: Build iOS IPA (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      # Build required native recipes for iOS
      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy numpy matplotlib

      # Automatically detect where main.py is and create the Xcode project
      - name: Locate Source Directory & Create Xcode Project
        run: |
          SRC_DIR="."
          if [ ! -f "$SRC_DIR/main.py" ]; then
            SRC_DIR=$(find . -name "main.py" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          fi
          echo "Found source directory: $SRC_DIR"
          toolchain create AurumTrustBank "$SRC_DIR"

      # Compile Xcode project to an iOS Application Bundle
      - name: Build Xcode Project
        run: |
          cd AurumTrustBank-ios
          xcodebuild clean build \
            -project aurumtrustbank.xcodeproj \
            -scheme aurumtrustbank \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Package the compiled .app into an installable .ipa
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r AurumTrustBank-ios/build/Release-iphoneos/aurumtrustbank.app Payload/
          zip -r AurumTrustBank.ipa Payload

      # Upload the final IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-IPA
          path: AurumTrustBank.ipa
          retention-days: 14

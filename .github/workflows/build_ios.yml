name: Build iOS Xcode Project (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      # Build required native recipes for iOS
      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy numpy matplotlib

      # Prepare the application source and create the Xcode project
      - name: Prepare App Directory & Create Xcode Project
        run: |
          set -e

          mkdir -p src_app

          if [ -f "main.py" ]; then
            cp main.py renderer_kivy.py "ATB EXPERIMENTAL.py" cour.ttf src_app/ 2>/dev/null || true

            if [ -d "Aurum_Trust_Bank" ]; then
              cp -R Aurum_Trust_Bank src_app/
            fi
          else
            APP_DIR=$(find . -name "main.py" \
              -not -path "*/.*" \
              -not -path "*src_app*" \
              -exec dirname {} \; | head -n 1)

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: main.py not found"
              exit 1
            fi

            cp -R "$APP_DIR"/. src_app/
          fi

          echo "Application files:"
          ls -la src_app

          if [ ! -f "src_app/main.py" ]; then
            echo "ERROR: src_app/main.py is missing"
            exit 1
          fi

          toolchain create AurumTrustBank "$GITHUB_WORKSPACE/src_app"

      # Find and package the generated Xcode project only
      - name: Package Xcode Project
        run: |
          set -e

          PROJ_DIR=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "*aurumtrustbank-ios*" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR=$(find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*AurumTrustBank-ios*" \
              -not -path "*/.git/*" \
              | head -n 1)
          fi

          if [ -z "$PROJ_DIR" ]; then
            echo "ERROR: Generated Xcode project directory not found"
            find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -print
            exit 1
          fi

          XCODEPROJ=$(find "$PROJ_DIR" \
            -name "*.xcodeproj" -print -quit)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: No .xcodeproj found"
            exit 1
          fi

          echo "Found project: $XCODEPROJ"

          cd "$GITHUB_WORKSPACE"
          zip -r AurumTrustBank-Xcode-Project.zip "$(basename "$PROJ_DIR")"

      # Upload the Xcode project ZIP
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-Xcode-Project
          path: AurumTrustBank-Xcode-Project.zip
          retention-days: 14
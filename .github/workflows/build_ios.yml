name: Build iOS Xcode Project (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy numpy matplotlib

      - name: Prepare App Directory & Create Xcode Project
        run: |
          mkdir -p src_app

          if [ -f "main.py" ]; then
            cp main.py renderer_kivy.py "ATB EXPERIMENTAL.py" cour.ttf src_app/ 2>/dev/null || true

            if [ -d "Aurum_Trust_Bank" ]; then
              cp -R Aurum_Trust_Bank src_app/
            fi
          else
            APP_DIR=$(find . -name "main.py" \
              -not -path "*/.*" \
              -not -path "*src_app*" \
              -exec dirname {} \; | head -n 1)

            if [ -z "$APP_DIR" ]; then
              echo "Error: Could not find main.py"
              exit 1
            fi

            cp -R "$APP_DIR"/. src_app/
          fi

          echo "Files in src_app:"
          ls -la src_app

          toolchain create AurumTrustBank src_app

      - name: Package Xcode Project
        run: |
          PROJ_DIR=$(find . -maxdepth 1 -type d \
            \( -name "*aurumtrustbank-ios*" -o -name "*AurumTrustBank-ios*" \) \
            | head -n 1)

          if [ -z "$PROJ_DIR" ]; then
            echo "Error: Xcode project directory not found"
            find . -maxdepth 3 -name "*.xcodeproj" -print
            exit 1
          fi

          echo "Found project: $PROJ_DIR"
          zip -r AurumTrustBank-Xcode-Project.zip "$PROJ_DIR"

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-Xcode-Project
          path: AurumTrustBank-Xcode-Project.zip
          retention-days: 14

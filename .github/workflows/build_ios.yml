name: Build iOS Xcode Project (kivy-ios)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools via Homebrew
        run: |
          brew install autoconf automake libtool pkg-config cmake

      - name: Install kivy-ios & Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 kivy-ios

      - name: Build Recipes for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create AurumTrustBank ios_project

      - name: Zip Xcode Project for Download
        run: |
          zip -r AurumTrustBank-Xcode.zip AurumTrustBank-ios

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-Xcode-Project
          path: AurumTrustBank-Xcode.zip
          retention-days: 14
